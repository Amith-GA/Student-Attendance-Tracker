<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student - Attendance Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
<aside th:replace="~{fragments/sidebar :: sidebar('home')}"></aside>
<main class="main">
    <h1 class="page-title">My attendance</h1>
    <p class="page-sub">
        <strong th:text="${fullName}"></strong>
        <span th:if="${student != null}">
            &middot; Roll no <span th:text="${student.rollNo}"></span>
            &middot; Class <span th:text="${student.classRoom.name}"></span>
        </span>
    </p>

    <!-- The admin has not added this account to a class yet -->
    <div class="card" th:if="${student == null}">
        <p class="empty">You are not enrolled in a class yet. Please ask the admin.</p>
    </div>

    <div th:if="${student != null}">
        <!-- AT-38: warning for every subject below 75% -->
        <div class="warning" th:if="${!#lists.isEmpty(lowSubjects)}">
            <strong>&#9888; Low attendance warning</strong>
            <p>Your attendance is below <span th:text="${minimumPercent}"></span>% in:</p>
            <ul>
                <li th:each="s : ${lowSubjects}"
                    th:text="${s.subjectName + ' (' + s.percentage + '%, ' + s.attended + ' of ' + s.total + ' classes)'}"></li>
            </ul>
        </div>

        <div class="card">
            <p class="empty" th:if="${#lists.isEmpty(rows)}">Your class has no subjects yet.</p>
            <table th:unless="${#lists.isEmpty(rows)}">
                <thead>
                <tr><th>Subject</th><th>Classes attended</th><th>Total classes</th><th>Attendance %</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rows}" th:classappend="${r.belowLimit} ? 'low'">
                    <td th:text="${r.subjectName}"></td>
                    <td th:text="${r.attended}"></td>
                    <td th:text="${r.total}"></td>
                    <td>
                        <span th:if="${r.noClassesYet}">-</span>
                        <span th:unless="${r.noClassesYet}" th:text="${r.percentage + '%'}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="hint">Present and Late both count as attended.</p>
        </div>
    </div>
</main>
</div>
</body>
</html>
