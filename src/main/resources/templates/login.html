<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Attendance Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<div class="login-box">
    <div class="brand">
        <span class="brand-mark">AT</span>
        <span class="brand-name">Student Attendance Tracker</span>
    </div>
    <div class="card">
        <h2>Welcome back</h2>
        <p class="hint">Log in with the username and password given to you.</p>

        <p class="error" th:if="${param.error}">Invalid username or password, or the account is deactivated.</p>
        <p class="info" th:if="${param.logout}">You have been logged out.</p>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log in</button>
        </form>
    </div>
</div>
</body>
</html>
