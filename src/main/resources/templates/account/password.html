<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password - Attendance Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div class="app">
<aside th:replace="~{fragments/sidebar :: sidebar('password')}"></aside>
<main class="main">
    <h1 class="page-title">Change password</h1>
    <p class="page-sub">Choose a new password for your own account.</p>

    <!-- Success / error messages sent by the controller -->
    <p class="info" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="card">
        <form th:action="@{/account/password}" method="post">
            <label for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password">

            <label for="newPassword">New password (at least 6 characters)</label>
            <input type="password" id="newPassword" name="newPassword" required minlength="6" autocomplete="new-password">

            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password">

            <label class="show-password"><input type="checkbox" data-show-password> Show passwords</label>

            <button type="submit">Change password</button>
        </form>
    </div>
</main>
</div>
</body>
</html>
