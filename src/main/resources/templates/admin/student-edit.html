<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit student - Attendance Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/admin-nav :: nav}"></nav>
<div class="container">
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <div class="card">
        <h2>Edit student</h2>
        <form th:action="@{/admin/students/{id}/edit(id=${student.id})}" method="post">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" th:value="${student.user.fullName}" required>

            <label for="rollNo">Roll number</label>
            <input type="text" id="rollNo" name="rollNo" th:value="${student.rollNo}" required>

            <label for="classId">Class</label>
            <select id="classId" name="classId" required>
                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${c.id == student.classRoom.id}"></option>
            </select>

            <label for="username">Login username</label>
            <input type="text" id="username" name="username" th:value="${student.user.username}" required>

            <label for="newPassword">New password (leave empty to keep the current one)</label>
            <input type="password" id="newPassword" name="newPassword" minlength="6">

            <button type="submit">Save</button>
            <a class="btn btn-grey" th:href="@{/admin/students}">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
