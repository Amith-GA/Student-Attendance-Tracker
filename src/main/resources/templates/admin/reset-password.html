<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password - Attendance Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div class="app">
<aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside>
<main class="main">
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="card">
        <h2>Reset password</h2>
        <p>
            Set a new password for <strong th:text="${user.fullName}"></strong>
            (username <strong th:text="${user.username}"></strong>).
            Tell them the new password; they can then change it themselves from the Change password page.
        </p>
        <form th:action="@{/admin/users/{id}/reset-password(id=${user.id})}" method="post">
            <label for="newPassword">New password (at least 6 characters)</label>
            <input type="password" id="newPassword" name="newPassword" required minlength="6" autocomplete="new-password">

            <label class="show-password"><input type="checkbox" data-show-password> Show password</label>

            <button type="submit">Set new password</button>
            <a class="btn btn-grey" th:href="@{${backUrl}}">Cancel</a>
        </form>
    </div>
</main>
</div>
</body>
</html>
