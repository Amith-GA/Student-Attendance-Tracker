<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classes &amp; Subjects - Attendance Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/admin-nav :: nav}"></nav>
<div class="container">

    <!-- Success / error messages sent by the controller -->
    <p class="info" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="card">
        <h2>Add a class</h2>
        <form th:action="@{/admin/classes}" method="post">
            <label for="className">Class name (e.g. CSE 5A)</label>
            <input type="text" id="className" name="name" required>
            <button type="submit">Add class</button>
        </form>
    </div>

    <div class="card">
        <h2>Add a subject to a class</h2>
        <p th:if="${#lists.isEmpty(classes)}">Add a class first.</p>
        <form th:unless="${#lists.isEmpty(classes)}" th:action="@{/admin/subjects}" method="post">
            <label for="subjectName">Subject name</label>
            <input type="text" id="subjectName" name="name" required>

            <label for="classId">Class</label>
            <select id="classId" name="classId" required>
                <option value="">-- choose a class --</option>
                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>

            <label for="teacherId">Teacher</label>
            <select id="teacherId" name="teacherId">
                <option value="">-- no teacher yet --</option>
                <option th:each="t : ${teachers}" th:value="${t.id}"
                        th:text="${t.fullName + ' (' + t.username + ')'}"></option>
            </select>
            <button type="submit">Add subject</button>
        </form>
    </div>

    <div class="card">
        <h2>Classes and their subjects</h2>
        <p th:if="${#lists.isEmpty(classes)}">No classes yet.</p>
        <table th:unless="${#lists.isEmpty(classes)}">
            <thead>
            <tr><th>Class</th><th>Subject</th><th>Teacher</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${subjects}">
                <td th:text="${s.classRoom.name}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.teacher != null ? s.teacher.fullName : '(not assigned)'}"></td>
            </tr>
            </tbody>
        </table>
        <p th:if="${!#lists.isEmpty(classes) and #lists.isEmpty(subjects)}">No subjects added yet.</p>
        <p>Classes: <span th:each="c, i : ${classes}" th:text="${c.name + (i.last ? '' : ', ')}"></span></p>
    </div>
</div>
</body>
</html>
