<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit teacher - Attendance Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/admin-nav :: nav}"></nav>
<div class="container">
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <div class="card">
        <h2>Edit teacher</h2>
        <form th:action="@{/admin/teachers/{id}/edit(id=${teacher.id})}" method="post">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" th:value="${teacher.fullName}" required>

            <label for="username">Login username</label>
            <input type="text" id="username" name="username" th:value="${teacher.username}" required>

            <label for="newPassword">New password (leave empty to keep the current one)</label>
            <input type="password" id="newPassword" name="newPassword" minlength="6">

            <button type="submit">Save</button>
            <a class="btn btn-grey" th:href="@{/admin/teachers}">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
