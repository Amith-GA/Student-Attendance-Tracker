<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Export attendance - Attendance Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
<aside th:replace="~{fragments/sidebar :: sidebar('export')}"></aside>
<main class="main">
    <div class="card">
        <h2>Export attendance</h2>
        <p>Download all saved attendance as a CSV file that opens in Excel.</p>
        <p>Columns: Class, Roll No, Student, Subject, Date, Status.</p>
        <p>Records in the file: <strong th:text="${recordCount}"></strong></p>
        <a class="btn" th:href="@{/admin/export/attendance.csv}">Download CSV</a>
    </div>
</main>
</div>
</body>
</html>
