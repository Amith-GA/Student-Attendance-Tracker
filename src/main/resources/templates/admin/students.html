<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students - Attendance Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">
<aside th:replace="~{fragments/sidebar :: sidebar('students')}"></aside>
<main class="main">
    <h1 class="page-title">Students</h1>
    <p class="page-sub">Add students, edit their details and switch their login on or off.</p>

    <!-- Success / error messages sent by the controller -->
    <p class="info" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="card">
        <h2>Add a student</h2>
        <p th:if="${#lists.isEmpty(classes)}">
            Add a class first on the <a th:href="@{/admin/classes}">Classes &amp; Subjects</a> page.
        </p>
        <form th:unless="${#lists.isEmpty(classes)}" th:action="@{/admin/students}" method="post">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="rollNo">Roll number</label>
            <input type="text" id="rollNo" name="rollNo" required>

            <label for="classId">Class</label>
            <select id="classId" name="classId" required>
                <option value="">-- choose a class --</option>
                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>

            <label for="username">Login username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Login password (at least 6 characters)</label>
            <input type="password" id="password" name="password" required minlength="6">

            <button type="submit">Add student</button>
        </form>
    </div>

    <div class="card">
        <h2>All students</h2>
        <p th:if="${#lists.isEmpty(students)}">No students yet.</p>
        <table th:unless="${#lists.isEmpty(students)}">
            <thead>
            <tr><th>Class</th><th>Roll no</th><th>Name</th><th>Username</th><th>Login</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${students}" th:classappend="${!s.user.active} ? 'inactive'">
                <td th:text="${s.classRoom.name}"></td>
                <td th:text="${s.rollNo}"></td>
                <td th:text="${s.user.fullName}"></td>
                <td th:text="${s.user.username}"></td>
                <td th:text="${s.user.active ? 'Active' : 'Deactivated'}"></td>
                <td class="actions">
                    <a class="btn-small" th:href="@{/admin/students/{id}/edit(id=${s.id})}">Edit</a>
                    <!-- AT-49: switch the login off or on; attendance records are kept either way -->
                    <form th:if="${s.user.active}" th:action="@{/admin/students/{id}/deactivate(id=${s.id})}" method="post">
                        <button type="submit" class="btn-small btn-grey"
                                onclick="return confirm('Deactivate this student? They will not be able to log in. Attendance records are kept.')">Deactivate</button>
                    </form>
                    <form th:unless="${s.user.active}" th:action="@{/admin/students/{id}/activate(id=${s.id})}" method="post">
                        <button type="submit" class="btn-small">Activate</button>
                    </form>
                    <form th:action="@{/admin/students/{id}/delete(id=${s.id})}" method="post">
                        <button type="submit" class="btn-small btn-danger"
                                onclick="return confirm('Delete this student, their login and all their attendance records? This cannot be undone.')">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</div>
</body>
</html>
