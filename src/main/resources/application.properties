spring.application.name=attendance-tracker

# H2 database saved to a file, so data survives restarts (folder ./data)
spring.datasource.url=jdbc:h2:file:./data/attendancedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Creates/updates tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
